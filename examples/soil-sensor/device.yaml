# Example device. Part numbers and prices are illustrative placeholders, not looked up.
name: Soil Sensor
summary: >
  A battery-powered stake that measures soil moisture and temperature in a garden bed and
  reports over Wi-Fi a few times an hour.

requirements:
  functions:
    - read soil moisture and soil temperature every 15 minutes
    - send readings over Wi-Fi to a home server
    - run at least 180 days on one charge
    - charge over USB-C
  quantity: 200
  target_unit_cost_usd: 18
  markets: [US, EU]
  environment: outdoor, splash resistant
  size_mm: [40, 30, 160]
  battery_life_days: 180
  schedule_weeks: 12

blocks:
  - {id: mcu, kind: compute, part: wifi-module, io_v: 3.3, programmable: true}
  - {id: moisture, kind: sensor, part: moisture-afe, io_v: 3.3}
  - {id: temp, kind: sensor, part: temp-sensor, io_v: 3.3}
  - {id: charger, kind: power, part: charger-ic}
  - {id: regulator, kind: power, part: buck-boost}
  - {id: usb, kind: electronics, part: usb-c-receptacle}
  - {id: housing, kind: mechanical}

interfaces:
  - {from: mcu, to: temp, kind: i2c}
  - {from: mcu, to: moisture, kind: analog}
  - {from: usb, to: charger, kind: power}
  - {from: charger, to: regulator, kind: power}
  - {from: regulator, to: mcu, kind: power}

power:
  sources:
    - {id: batt, kind: battery, chemistry: li-ion, voltage_v: 3.7, min_voltage_v: 3.0, capacity_mah: 1200}
  rails:
    - {id: 3v3, from: batt, voltage_v: 3.3, regulator: buck-boost, efficiency: 0.88, max_current_ma: 800, quiescent_ma: 0.002}
  loads:
    - {block: mcu, rail: 3v3, active_ma: 90, peak_ma: 350, sleep_ma: 0.008, duty: 0.004}
    - {block: moisture, rail: 3v3, active_ma: 3, sleep_ma: 0, duty: 0.002}
    - {block: temp, rail: 3v3, active_ma: 0.5, sleep_ma: 0.0005, duty: 0.002}
    - {block: usb, rail: batt, active_ma: 0}

parts:
  - {id: wifi-module, mpn: EXAMPLE-WIFI-MODULE, category: module, qty: 1, unit_cost_usd: {1: 3.2, 100: 2.6, 1000: 2.2},
     suppliers: [distributor-a, distributor-b], lifecycle: active, lead_time_weeks: 3, features: [radio-wifi, radio-ble], certified: true}
  - {id: moisture-afe, mpn: EXAMPLE-OPAMP, category: ic, qty: 1, unit_cost_usd: 0.35, suppliers: [distributor-a, distributor-b], lifecycle: active, lead_time_weeks: 2}
  - {id: temp-sensor, mpn: EXAMPLE-TEMP-I2C, category: sensor, qty: 1, unit_cost_usd: {1: 1.1, 100: 0.8}, suppliers: [distributor-a, distributor-b], lifecycle: active, lead_time_weeks: 4}
  - {id: charger-ic, mpn: EXAMPLE-CHARGER, category: ic, qty: 1, unit_cost_usd: 0.6, suppliers: [distributor-a, distributor-b], lifecycle: active, lead_time_weeks: 2}
  - {id: buck-boost, mpn: EXAMPLE-BUCKBOOST, category: ic, qty: 1, unit_cost_usd: 1.4, suppliers: [distributor-a], lifecycle: active, lead_time_weeks: 6}
  - {id: usb-c-receptacle, mpn: EXAMPLE-USBC-16P, category: connector, qty: 1, unit_cost_usd: 0.25, suppliers: [distributor-a, distributor-b], lifecycle: active, lead_time_weeks: 2}
  - {id: cell, mpn: EXAMPLE-LIION-1200, category: battery, qty: 1, unit_cost_usd: 2.9, suppliers: [cell-vendor-a, cell-vendor-b], lifecycle: active, lead_time_weeks: 5, dims_mm: [34, 25, 10]}
  - {id: passives, mpn: EXAMPLE-PASSIVE-KIT, category: passive, qty: 1, unit_cost_usd: 0.4, suppliers: [distributor-a], lifecycle: active, lead_time_weeks: 1}
  - {id: pcb, mpn: EXAMPLE-PCB-2L, category: pcb, qty: 1, unit_cost_usd: {1: 4.0, 100: 0.9}, suppliers: [fab-a, fab-b], lifecycle: active, lead_time_weeks: 1}

boards:
  - {id: main, source: hardware/main, size_mm: [28, 120], height_mm: 6, layers: 2}

mechanical:
  - {id: housing, process: sla, material: tough resin, source: mechanical/housing.py,
     inner_mm: [32, 26, 150], wall_mm: 2, holds: [main, cell], clearance_mm: 1}

firmware:
  - {id: fw, target: mcu, framework: platformio, path: firmware}

compliance:
  plans:
    FCC Part 15 Subpart B: pre-scan first prototype, then accredited lab
    FCC modular grant reuse: follow module integration guide, label with module FCC ID
    CE marking + Declaration of Conformity: compile technical file after RED testing

manufacturing:
  pcb_fab: ""
  assembly: ""
  test_plan: ""

decisions:
  - {decision: "pre-certified Wi-Fi module instead of a chip-down radio", why: "avoids intentional-radiator certification at 200 units"}
  - {decision: "buck-boost instead of LDO", why: "an LDO at 3.3 V drops out before the cell is empty"}
