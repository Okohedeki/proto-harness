# Example device. Electronic parts are real and priced live by `ph parts` (see parts.lock.json).
# The cell, passives kit and PCB are placeholders with rough typed prices.
name: Soil Sensor
summary: >
  A battery-powered stake that measures soil moisture and temperature in a garden bed and
  reports over Wi-Fi a few times an hour.

requirements:
  functions:
    - read soil moisture and soil temperature every 15 minutes
    - send readings over Wi-Fi to a home server
    - run at least 180 days on one charge
    - charge over USB-C
  quantity: 200
  target_unit_cost_usd: 18
  markets: [US, EU]
  environment: outdoor, splash resistant
  size_mm: [40, 30, 160]
  battery_life_days: 180
  schedule_weeks: 12

blocks:
  - {id: mcu, kind: compute, part: wifi-module, io_v: 3.3, programmable: true}
  - {id: moisture, kind: sensor, part: moisture-afe, io_v: 3.3}
  - {id: temp, kind: sensor, part: temp-sensor, io_v: 3.3}
  - {id: charger, kind: power, part: charger-ic}
  - {id: regulator, kind: power, part: buck-boost}
  - {id: usb, kind: electronics, part: usb-c-receptacle}
  - {id: housing, kind: mechanical}

interfaces:
  - {from: mcu, to: temp, kind: i2c}
  - {from: mcu, to: moisture, kind: analog}
  - {from: usb, to: charger, kind: power}
  - {from: charger, to: regulator, kind: power}
  - {from: regulator, to: mcu, kind: power}

power:
  sources:
    - {id: batt, kind: battery, chemistry: li-ion, voltage_v: 3.7, min_voltage_v: 3.0, capacity_mah: 1200}
  rails:
    - {id: 3v3, from: batt, voltage_v: 3.3, regulator: buck-boost, efficiency: 0.88, max_current_ma: 800, quiescent_ma: 0.025}
  loads:
    - {block: mcu, rail: 3v3, active_ma: 90, peak_ma: 350, sleep_ma: 0.008, duty: 0.004}
    - {block: moisture, rail: 3v3, active_ma: 3, sleep_ma: 0, duty: 0.002}
    - {block: temp, rail: 3v3, active_ma: 0.5, sleep_ma: 0.0005, duty: 0.002}
    - {block: usb, rail: batt, active_ma: 0}

parts:
  # Live parts: price, stock and suppliers come from parts.lock.json. `lcsc:` makes the LCSC lookup exact.
  - {id: wifi-module, mpn: ESP32-C3-MINI-1-N4, lcsc: C2838502, category: module, qty: 1, lifecycle: active,
     features: [radio-wifi, radio-ble], certified: true}
  - {id: moisture-afe, mpn: LMV321IDBVR, lcsc: C7972, category: ic, qty: 1, lifecycle: active}
  - {id: temp-sensor, mpn: SHT40-AD1B-R2, category: sensor, qty: 1, lifecycle: active}   # no LCSC code: needs DigiKey or Mouser keys
  - {id: charger-ic, mpn: TP4056, lcsc: C725790, category: ic, qty: 1, lifecycle: active}
  - {id: buck-boost, mpn: TPS63020DSJR, lcsc: C15483, category: ic, qty: 1, lifecycle: active}
  - {id: usb-c-receptacle, mpn: TYPE-C-31-M-12, lcsc: C165948, category: connector, qty: 1, lifecycle: active}
  # Placeholders: not looked up.
  - {id: cell, mpn: EXAMPLE-LIION-1200, no_lookup: true, category: battery, qty: 1, unit_cost_usd: 2.9, suppliers: [cell-vendor-a, cell-vendor-b], lifecycle: active, lead_time_weeks: 5, dims_mm: [34, 25, 10]}
  - {id: passives, mpn: EXAMPLE-PASSIVE-KIT, no_lookup: true, category: passive, qty: 1, unit_cost_usd: 0.4, suppliers: [distributor-a], lifecycle: active, lead_time_weeks: 1}
  - {id: pcb, mpn: EXAMPLE-PCB-2L, no_lookup: true, category: pcb, qty: 1, unit_cost_usd: {1: 4.0, 100: 0.9}, suppliers: [fab-a, fab-b], lifecycle: active, lead_time_weeks: 1}

boards:
  - {id: main, source: hardware/main, size_mm: [28, 120], height_mm: 6, layers: 2}

mechanical:
  - {id: housing, process: sla, material: tough resin, source: mechanical/housing.py,
     inner_mm: [32, 26, 150], wall_mm: 2, holds: [main, cell], clearance_mm: 1}

firmware:
  - {id: fw, target: mcu, framework: platformio, path: firmware}

compliance:
  plans:
    FCC Part 15 Subpart B: pre-scan first prototype, then accredited lab
    FCC modular grant reuse: follow module integration guide, label with module FCC ID
    CE marking + Declaration of Conformity: compile technical file after RED testing

manufacturing:
  pcb_fab: ""
  assembly: ""
  test_plan: ""

decisions:
  - {decision: "pre-certified Wi-Fi module instead of a chip-down radio", why: "avoids intentional-radiator certification at 200 units"}
  - {decision: "buck-boost instead of LDO", why: "an LDO at 3.3 V drops out before the cell is empty"}
