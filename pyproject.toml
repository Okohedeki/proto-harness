[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proto-harness"
version = "0.1.0"
description = "One place for a whole hardware device: spec, architecture, power, parts, boards, enclosure, firmware, compliance and manufacturing, with a check gate at every stage."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
circuits = ["skidl>=2"]

[project.scripts]
ph = "protoharness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
protoharness = ["templates/**/*", "templates/*"]
